<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | Product preview card component</title>

  
</head>
<body>
<main class="main">

  <article class="product-card">
   <!-- Image Section -->
    <picture>
      <source 
        media="(min-width: 600px)"
        srcset="images/image-product-desktop.jpg"
      >
      
      <img 
        class="product-card-image" 
        src="images/image-product-mobile.jpg" 
        alt="Gabrielle Essence Eau De Parfum perfume bottle"
      >
    </picture>

    <!-- Product Card Content -->
    <div class="product-card-content">

      <!-- Perfume Section -->
      <p class="product-category">Perfume</p>

      <!-- Heading Section -->
      <h1 class="product-title">Gabrielle Essence Eau De Parfum</h1>

      <!-- Description Section -->
      <p class="product-description">
        A floral, solar and voluptuous interpretation composed by Olivier Polge, 
        Perfumer-Creator for the House of CHANEL.
      </p>

      <!-- Price Section -->
      <div class="product-price"> 
        <p class="product-price-current">$149.99</p>
        <s class="product-price-original">$169.99</s>
      </div>

      <!-- Button Section -->
      <button class="product-button" type="button">
        <img src="images/icon-cart.svg" alt="">
        Add to Cart
      </button>

    </div>
    
  </article>
</main>  
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Quentin Cyrus</a>.
  </footer>

</body>
</html>
