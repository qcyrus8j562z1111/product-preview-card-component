<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Product preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
<main>
  <article>
   <!-- Image Section -->
    <picture>
      <source srcset="images/image-product-desktop.jpg">
      <img src="images/image-product-mobile.jpg" alt="Gabrielle Essence Eau De Parfum perfume bottle">
    </picture>

    <!-- Perfume Section -->
    <p>Perfume</p>

    <!-- Heading Section -->
    <h1>Gabrielle Essence Eau De Parfum</h1>

    <!-- Description Section -->
    <p>A floral, solar and voluptuous interpretation composed by Olivier Polge, 
    Perfumer-Creator for the House of CHANEL.</p>

    <!-- Price Section -->
    <div> 
      <p>$149.99</p>
      <s>$169.99</s>
    </div>

    <!-- Button Section -->
     <button type="button">
      <img src="images/icon-cart.svg" alt="">
      Add to Cart
    </button>
    
  </article>
</main>  
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Quentin Cyrus</a>.
  </footer>
</body>
</html>
